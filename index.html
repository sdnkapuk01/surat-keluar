<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Surat Keluar - SDN Kapuk 01</title>
  <link rel="icon" type="image/png" href="logo-sdnkapuk01.png" />
  <link rel="shortcut icon" type="image/png" href="logo-sdnkapuk01.png" />
  <link rel="apple-touch-icon" href="logo-sdnkapuk01.png" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; overflow: hidden; background-color: #ffffff; font-family: system-ui, -apple-system, sans-serif; }
    iframe { width: 100%; height: 100%; border: none; display: block; }
    .guard-msg {
      display: flex; align-items: center; justify-content: center;
      height: 100%; text-align: center; padding: 24px; color: #1e293b;
    }
  </style>
</head>
<body>
  <div id="app-container" style="width:100%; height:100%;"></div>

  <script>
    const PORTAL_URL = 'https://sdnkapuk01.github.io/';
    const MODULE_KEY = 'surat-keluar'; // Ubah sesuai modul: 'kesiswaan', 'surat-masuk', 'surat-keluar', 'generator-soal'
    const GAS_APP_URL = 'https://script.google.com/macros/s/AKfycbzJc2vH9JskTD_oIC9D9xKk6j7tlS64-7eQlBg-dioaYsfPNIXQI2erfBkpUAxK9n_R/exec';

    (function initSecureIframe() {
      const container = document.getElementById('app-container');

      try {
        const raw = localStorage.getItem('sdnkapuk01_portal_session_v1');
        if (!raw) {
          window.location.replace(PORTAL_URL);
          return;
        }

        const session = JSON.parse(raw);
        if (!session || !session.token || Date.now() > session.expiresAt) {
          localStorage.removeItem('sdnkapuk01_portal_session_v1');
          window.location.replace(PORTAL_URL);
          return;
        }

        // Cek hak akses modul untuk operator
        const allowed = Array.isArray(session.allowedModules) ? session.allowedModules : ['ALL'];
        if (session.role !== 'admin' && !allowed.includes('ALL') && !allowed.includes(MODULE_KEY)) {
          container.innerHTML = `
            <div class="guard-msg">
              <div>
                <h2 style="margin-bottom:8px;">Akses Modul Dibatasi</h2>
                <p style="color:#64748b; margin-bottom:16px;">Akun Anda tidak memiliki izin membuka modul <strong>${MODULE_KEY}</strong>.</p>
                <a href="${PORTAL_URL}" style="padding:10px 18px; background:#0f172a; color:#fff; border-radius:10px; text-decoration:none; font-size:14px;">Kembali ke Portal Utama</a>
              </div>
            </div>`;
          return;
        }

        // Bangun URL GAS dengan parameter sesi dari Portal
        const targetUrl = new URL(GAS_APP_URL);
        targetUrl.searchParams.set('token', session.token);
        targetUrl.searchParams.set('role', session.role);
        targetUrl.searchParams.set('user', session.username);
        targetUrl.searchParams.set('nama', session.nama);

        container.innerHTML = `
          <iframe
            src="${targetUrl.toString()}"
            title="Surat Keluar - SDN Kapuk 01"
            allow="clipboard-read; clipboard-write; camera; microphone"
            loading="eager"
          ></iframe>`;
      } catch (e) {
        window.location.replace(PORTAL_URL);
      }
    })();
  </script>
</body>
</html>
